[project]
name = "retailops-bd-api"
version = "0.1.0"
description = "RetailOps BD FastAPI service"
readme = "README.md"
requires-python = "==3.13.16"
dependencies = [
  "alembic>=1.20.0,<2",
  "argon2-cffi>=25.1.0,<26",
  "celery[redis]>=5.6.0,<6",
  "email-validator>=2.3.0,<3",
  "fastapi>=0.120.0,<1",
  "pyjwt>=2.10.1,<3",
  "psycopg[binary,pool]>=3.2.10,<4",
  "pydantic-settings>=2.11.0,<3",
  "redis>=7.0.0,<8",
  "sqlalchemy[asyncio]>=2.0.43,<3",
  "structlog>=25.4.0,<26",
  "uvicorn[standard]>=0.37.0,<1",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21.0,<1",
  "httpx>=0.28.1,<1",
  "mypy>=1.18.2,<2",
  "pytest>=8.4.2,<9",
  "pytest-asyncio>=1.2.0,<2",
  "ruff>=0.13.2,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true


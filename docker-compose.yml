name: retailops-bd

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retailops}
      POSTGRES_USER: ${POSTGRES_USER:-retailops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retailops}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4.5-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: development
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      APP_SECRET_KEY: local-compose-only-secret
      APP_DATABASE_URL: postgresql+psycopg://retailops:retailops@postgres:5432/retailops
      APP_REDIS_URL: redis://redis:6379/0
      APP_CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      target: development
    command: ["uv", "run", "celery", "-A", "app.tasks.celery_app:celery_app", "worker", "--loglevel=INFO"]
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      APP_SECRET_KEY: local-compose-only-secret
      APP_DATABASE_URL: postgresql+psycopg://retailops:retailops@postgres:5432/retailops
      APP_REDIS_URL: redis://redis:6379/0
      APP_CORS_ORIGINS: '["http://localhost:5173"]'
    volumes:
      - ./backend:/app
      - worker_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backend_venv:
  worker_venv:
  frontend_node_modules:

